<!-- templates/telemetry.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автопарк - Телематика</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo"><h2>Автопарк</h2></div>
            <nav class="tabs-nav">
                <a href="{% url 'dashboard' %}" class="tab-btn">Дашборд</a>
                <a href="{% url 'vehicle_list' %}" class="tab-btn">Весь транспорт</a>
                <a href="{% url 'driver_list' %}" class="tab-btn">Водители</a>
                <a href="{% url 'route_list' %}" class="tab-btn">Маршруты</a>
                <a href="{% url 'refuel_list' %}" class="tab-btn">Информация о заправках</a>
                <a href="{% url 'maintenance_list' %}" class="tab-btn">Техническое обслуживание</a>
                <a href="{% url 'telemetry' %}" class="tab-btn active">Телематика</a>
            </nav>
        </aside>
        <main class="content">
            <div class="telemetry-container">
                <h1>Мониторинг транспорта в реальном времени</h1>
                <div id="telemetryMap" style="height: 70vh; width: 100%; border-radius: 16px; margin-top: 1rem;"></div>
                <div class="legend">
                    <span class="legend-item"><i class="marker-free"></i> Свободен</span>
                    <span class="legend-item"><i class="marker-route"></i> В рейсе</span>
                    <span class="legend-item"><i class="marker-maintenance"></i> На ТО</span>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Данные передаются в виде JSON-строки с null вместо None
        const vehiclesData = {{ vehicles_json|safe }};
    </script>
    <script src="{% static 'js/telemetry.js' %}"></script>
</body>
</html>
