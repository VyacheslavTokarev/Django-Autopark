<!-- templates/refuel_add.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить заправку</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo"><h2>Автопарк</h2></div>
            <nav class="tabs-nav">
                <a href="{% url 'dashboard' %}" class="tab-btn">Дашборд</a>
                <a href="{% url 'vehicle_list' %}" class="tab-btn">Весь транспорт</a>
                <a href="{% url 'driver_list' %}" class="tab-btn">Водители</a>
                <a href="{% url 'route_list' %}" class="tab-btn">Маршруты</a>
                <a href="{% url 'refuel_list' %}" class="tab-btn active">Информация о заправках</a>
                <a href="{% url 'maintenance_list' %}" class="tab-btn">Техническое обслуживание</a>
                <a href="{% url 'telemetry' %}" class="tab-btn">Телематика</a>
            </nav>
        </aside>
        <main class="content">
            <div class="form-container">
                <h1>Добавить заправку</h1>
                <form method="post" id="refuelForm">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-column">
                            <div class="field-group">
                                <label>Транспортное средство:</label>
                                <select id="vehicleSelect" name="vehicle_id" required>
                                    <option value="">-- Выберите ТС --</option>
                                    {% for vehicle in vehicles %}
                                        <option value="{{ vehicle.id }}"
                                                data-fuel-level="{{ vehicle.fuel_level|default:0 }}"
                                                data-current-mileage="{{ vehicle.current_mileage }}">
                                            {{ vehicle.brand }} {{ vehicle.model }} ({{ vehicle.license_plate }})
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="field-group">
                                <label>Дата и время заправки:</label>
                                <input type="datetime-local" id="datetime" name="datetime" required>
                            </div>
                            <div class="field-group">
                                <label>Объем заправки (л):</label>
                                <input type="number" step="0.001" id="volume" name="volume_liters" required>
                            </div>
                            <div class="field-group">
                                <label>Цена за литр (₽):</label>
                                <input type="number" step="0.01" id="price" name="price_per_liter" required>
                            </div>
                            <div class="field-group">
                                <label>Текущий пробег (км):</label>
                                <input type="text" id="currentMileage" readonly>
                                <input type="hidden" id="mileageAtRefuel" name="mileage_at_refuel">
                            </div>
                            <div class="field-group">
                                <label>Уровень топлива до заправки (л):</label>
                                <input type="text" id="currentFuelLevel" readonly>
                            </div>
                            <div class="field-group">
                                <label>Уровень топлива после заправки (л):</label>
                                <input type="text" id="fuelLevelAfter" readonly>
                                <input type="hidden" id="fuelLevelAfterHidden" name="fuel_level_after">
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-add">Сохранить заправку</button>
                        <a href="{% url 'refuel_list' %}" class="btn-cancel">Отмена</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="{% static 'js/refuel_add.js' %}"></script>
</body>
</html>
