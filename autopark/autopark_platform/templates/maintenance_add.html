<!-- templates/maintenance_add.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить техническое обслуживание</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo"><h2>Автопарк</h2></div>
            <nav class="tabs-nav">
                <a href="{% url 'dashboard' %}" class="tab-btn">Дашборд</a>
                <a href="{% url 'vehicle_list' %}" class="tab-btn">Весь транспорт</a>
                <a href="{% url 'driver_list' %}" class="tab-btn">Водители</a>
                <a href="{% url 'route_list' %}" class="tab-btn">Маршруты</a>
                <a href="{% url 'refuel_list' %}" class="tab-btn">Информация о заправках</a>
                <a href="{% url 'maintenance_list' %}" class="tab-btn active">Техническое обслуживание</a>
                <a href="{% url 'telemetry' %}" class="tab-btn">Телематика</a>
            </nav>
        </aside>
        <main class="content">
            <div class="form-container">
                <h1>Новая запись ТО</h1>
                <form method="post" id="maintenanceForm">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-column">
                            <div class="field-group">
                                <label>Транспортное средство:</label>
                                <select id="vehicleSelect" name="vehicle_id" required>
                                    <option value="">-- Выберите ТС --</option>
                                    {% for vehicle in vehicles %}
                                        <option value="{{ vehicle.id }}" data-current-mileage="{{ vehicle.current_mileage }}">
                                            {{ vehicle.brand }} {{ vehicle.model }} ({{ vehicle.license_plate }})
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="field-group">
                                <label>Дата и время начала ТО:</label>
                                <input type="datetime-local" id="startDatetime" name="start_datetime" required>
                            </div>
                            <div class="field-group">
                                <label>Дата и время окончания ТО (необязательно):</label>
                                <input type="datetime-local" id="endDatetime" name="end_datetime">
                            </div>
                            <div class="field-group">
                                <label>Описание ТО (необязательно):</label>
                                <textarea id="description" name="description" rows="3"></textarea>
                            </div>
                            <div class="field-group">
                                <label>Стоимость ТО (₽, необязательно):</label>
                                <input type="number" step="0.01" id="cost" name="cost">
                            </div>
                            <div class="field-group">
                                <label>Пробег на момент ТО (км):</label>
                                <input type="text" id="mileageAtService" readonly>
                                <input type="hidden" id="mileageAtServiceHidden" name="mileage_at_service">
                            </div>
                            <div class="field-group">
                                <label>Дата следующего ТО (необязательно):</label>
                                <input type="date" id="nextMaintenanceDate" name="next_maintenance_date">
                            </div>
                            <div class="field-group">
                                <label>Пробег для следующего ТО (км, необязательно):</label>
                                <input type="number" step="1" id="nextMaintenanceMileage" name="next_maintenance_mileage">
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-add">Сохранить запись ТО</button>
                        <a href="{% url 'maintenance_list' %}" class="btn-cancel">Отмена</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="{% static 'js/maintenance_add.js' %}"></script>
</body>
</html>
