<!-- templates/vehicle_add.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить транспортное средство</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        /* Адаптив для форм добавления: группировка полей при маленькой ширине экрана */
        @media (max-width: 800px) {
            .form-grid {
                grid-template-columns: 1fr !important;
                gap: 1rem;
            }
            .field-group input,
            .field-group select,
            .field-group textarea {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo"><h2>Автопарк</h2></div>
            <nav class="tabs-nav">
                <a href="{% url 'dashboard' %}" class="tab-btn">Дашборд</a>
                <a href="{% url 'vehicle_list' %}" class="tab-btn active">Весь транспорт</a>
                <a href="{% url 'driver_list' %}" class="tab-btn">Водители</a>
                <a href="{% url 'route_list' %}" class="tab-btn">Маршруты</a>
                <a href="{% url 'refuel_list' %}" class="tab-btn">Информация о заправках</a>
                <a href="{% url 'maintenance_list' %}" class="tab-btn">Техническое обслуживание</a>
                <a href="{% url 'telemetry' %}" class="tab-btn">Телематика</a>
            </nav>
        </aside>
        <main class="content">
            <div class="form-container">
                <h1>Новое транспортное средство</h1>
                <form method="post" id="vehicleForm">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-column">
                            <div class="field-group">
                                <label>Марка:*</label>
                                <input type="text" name="brand" required>
                            </div>
                            <div class="field-group">
                                <label>Модель:*</label>
                                <input type="text" name="model" required>
                            </div>
                            <div class="field-group">
                                <label>Госномер:*</label>
                                <input type="text" name="license_plate" required>
                            </div>
                            <div class="field-group">
                                <label>Статус:*</label>
                                <select name="status" required>
                                    {% for value, label in status_choices %}
                                        <option value="{{ value }}">{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="field-group">
                                <label>Текущий пробег (км):*</label>
                                <input type="number" step="0.1" name="current_mileage" required>
                            </div>
                            <div class="field-group">
                                <label>Год выпуска:*</label>
                                <input type="number" min="1900" max="2026" name="year_of_manufacture" required>
                            </div>
                            <div class="field-group">
                                <label>VIN-номер:</label>
                                <input type="text" name="vin">
                            </div>
                            <div class="field-group">
                                <label>Уровень топлива (л):</label>
                                <input type="number" step="0.001" name="fuel_level">
                            </div>
                            <div class="field-group">
                                <label>Широта:</label>
                                <input type="number" step="0.000001" name="latitude">
                            </div>
                            <div class="field-group">
                                <label>Долгота:</label>
                                <input type="number" step="0.000001" name="longitude">
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-add">Сохранить ТС</button>
                        <a href="{% url 'vehicle_list' %}" class="btn-cancel">Отмена</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="{% static 'js/vehicle_add.js' %}"></script>
</body>
</html>
