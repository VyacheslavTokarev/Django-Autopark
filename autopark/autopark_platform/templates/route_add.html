<!-- templates/route_add.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить маршрут</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <!-- Leaflet Geocoder CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css" />
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo"><h2>Автопарк</h2></div>
            <nav class="tabs-nav">
                <a href="{% url 'dashboard' %}" class="tab-btn">Дашборд</a>
                <a href="{% url 'vehicle_list' %}" class="tab-btn">Весь транспорт</a>
                <a href="{% url 'driver_list' %}" class="tab-btn">Водители</a>
                <a href="{% url 'route_list' %}" class="tab-btn active">Маршруты</a>
                <a href="{% url 'refuel_list' %}" class="tab-btn">Информация о заправках</a>
                <a href="{% url 'maintenance_list' %}" class="tab-btn">Техническое обслуживание</a>
                <a href="{% url 'telemetry' %}" class="tab-btn">Телематика</a>
            </nav>
        </aside>
        <main class="content">
            <div class="form-container">
                <h1>Новый маршрут</h1>
                <form method="post" id="routeForm">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-column">
                            <h3>Отправление</h3>
                            <div class="field-group">
                                <label>Широта отправления:</label>
                                <input type="text" id="departure_latitude" name="departure_latitude" readonly required>
                            </div>
                            <div class="field-group">
                                <label>Долгота отправления:</label>
                                <input type="text" id="departure_longitude" name="departure_longitude" readonly required>
                            </div>
                            <div class="field-group">
                                <label>Почтовый адрес отправления:</label>
                                <input type="text" id="departure_address" name="departure_address" style="width: 100%;">
                            </div>

                            <h3>Прибытие</h3>
                            <div class="field-group">
                                <label>Широта прибытия:</label>
                                <input type="text" id="arrival_latitude" name="arrival_latitude" readonly required>
                            </div>
                            <div class="field-group">
                                <label>Долгота прибытия:</label>
                                <input type="text" id="arrival_longitude" name="arrival_longitude" readonly required>
                            </div>
                            <div class="field-group">
                                <label>Почтовый адрес прибытия:</label>
                                <input type="text" id="arrival_address" name="arrival_address" style="width: 100%;">
                            </div>

                            <div class="field-group">
                                <label>Дата и время отправления (Москва):</label>
                                <input type="datetime-local" id="departure_datetime" name="departure_datetime" required>
                            </div>
                            <div class="field-group">
                                <label>Кратчайший путь (км):</label>
                                <input type="number" step="0.001" id="shortest_distance_km" name="shortest_distance_km" readonly>
                            </div>
                            <div class="field-group">
                                <label>Водитель:</label>
                                <select id="driver" name="driver" required>
                                    <option value="">-- Выберите водителя --</option>
                                    {% for driver in drivers %}
                                        <option value="{{ driver.id }}" data-vehicle-id="{{ driver.vehicle.id|default:'' }}" data-vehicle-plate="{{ driver.vehicle.license_plate|default:'' }}">
                                            {{ driver.full_name }} {% if driver.vehicle %} ({{ driver.vehicle.license_plate }}){% endif %}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="field-group">
                                <label>Назначенное ТС (автоматически):</label>
                                <input type="text" id="vehicle_display" readonly>
                                <input type="hidden" id="vehicle_id" name="vehicle_id">
                            </div>
                        </div>
                        <div class="form-column">
                            <div id="map" style="height: 500px; width: 100%; border-radius: 12px;"></div>
                            <div class="info-note">* Кликните на карте для установки точек, или используйте поиск адреса через иконку 🔍</div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-add">Сохранить маршрут</button>
                        <a href="{% url 'route_list' %}" class="btn-cancel">Отмена</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- JS: Leaflet и плагины -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
    <script src="{% static 'js/route_add.js' %}"></script>
</body>
</html>
